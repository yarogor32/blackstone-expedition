<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Blackstone Room Constructor</title><link rel="stylesheet" href="rooms.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090b;color:#ead9b2;font-family:Georgia,serif}.room-builder-stage{position:fixed;inset:0}.builder{position:fixed;z-index:300;left:14px;top:14px;width:min(470px,calc(100vw - 28px));padding:13px;background:#071310ed;border:1px solid #b19055;box-shadow:0 8px 30px #000}.builder h1{margin:0 0 9px;font-size:17px;text-transform:uppercase;letter-spacing:.08em}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.controls label{font:10px Arial;color:#9fb9b2;text-transform:uppercase}.controls select,.seed{width:100%;margin-top:4px;padding:6px;background:#0d201c;color:#ead9b2;border:1px solid #6d684e}.tools{display:flex;gap:7px;margin-top:8px}.tools button{padding:7px 10px;background:#172b25;color:#ead9b2;border:1px solid #a48652;cursor:pointer}.meta{margin-top:7px;font:10px/1.5 Arial;color:#9fb9b2}.floor-guide{position:fixed;z-index:210;left:0;right:0;top:82.6171875vh;border-top:1px dashed #50e7ef88;pointer-events:none}.floor-guide:after{content:'floor anchor 82.6%';position:absolute;right:8px;top:-16px;color:#7de8ea;font:10px Arial}@media(max-width:650px){.builder{top:8px;left:8px;width:calc(100vw - 16px)}.builder h1,.meta{display:none}.controls{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="raid-room room-builder-stage" id="stage"></div><div class="floor-guide"></div><form class="builder"><h1>Blackstone Room Constructor</h1><div class="controls"></div><div class="tools"><button type="button" data-random>Generate combination</button><button type="button" data-copy>Copy JSON</button></div><div class="meta"></div></form><script src="room-system.js"></script><script>
const stage=document.querySelector('#stage'),controls=document.querySelector('.controls'),labels={deep:'Deep background',rear:'Background',middle:'Middle ground',ceiling:'Ceiling',floor:'Floor'};let seed='blackstone-preview',roomIndex=0,spec=BlackstoneRooms.combination(seed,'room-0',0);
controls.innerHTML=Object.keys(labels).map(key=>`<label>${labels[key]}<select data-layer="${key}">${[0,1,2,3].map(n=>`<option value="${n}">Variant ${n+1}</option>`).join('')}</select></label>`).join('');
function render(){stage.innerHTML=BlackstoneRooms.renderLayers(spec);for(const select of controls.querySelectorAll('select'))select.value=spec[select.dataset.layer];document.querySelector('.meta').textContent=`${innerWidth} × ${innerHeight} · ${innerWidth/innerHeight<1.5?'side crop':'full-height world'} · ${JSON.stringify(spec)}`;}
controls.addEventListener('change',e=>{if(e.target.dataset.layer){spec[e.target.dataset.layer]=Number(e.target.value);render();}});document.querySelector('[data-random]').onclick=()=>{roomIndex++;spec=BlackstoneRooms.combination(seed,`room-${roomIndex}`,roomIndex);render();};document.querySelector('[data-copy]').onclick=()=>navigator.clipboard?.writeText(JSON.stringify(spec));addEventListener('resize',render);render();
</script></body></html>
